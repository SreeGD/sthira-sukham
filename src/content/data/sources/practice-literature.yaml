# Evidence for movement drawn from yoga, Pilates, and tai chi.
#
# Principle IV note: these are peer-reviewed studies OF traditional practices, not
# practice literature itself. They support claims about what the movement DOES.
# Claims about what a tradition HOLDS need practice-literature sources, and none has
# been verified for this project yet — so no content currently makes such a claim.
# Add a practice-literature entry only after opening the actual text and confirming
# its edition and ISBN.

