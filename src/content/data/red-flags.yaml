# Signs that warrant assessment by a clinician rather than a stretch (FR-004).
#
# All eight signs named in FR-004 are present. scripts/validate-content.ts asserts
# each id below exists, so deleting one breaks the build rather than quietly
# shrinking the safety content.

- id: locking
  sign: The knee locks or catches
  description: >-
    The knee gets stuck part-way through bending or straightening, or catches sharply and
    then releases. Something may be physically blocking the joint, and forcing movement
    through a block can do damage.
  sources: [aaos-knee-arthritis, nice-ng226-osteoarthritis-2022]

- id: giving-way
  sign: The knee gives way
  description: >-
    The leg buckles or collapses under you without warning. This points to instability or
    to the muscles not firing when needed, and it carries a real risk of falling.
  sources: [aaos-knee-arthritis]

- id: cannot-bear-weight
  sign: You cannot put weight through the leg
  description: >-
    You are unable to stand or walk on the leg, or can only do so with severe pain. This
    needs assessment before any exercise.
  sources: [aaos-knee-arthritis, nice-ng226-osteoarthritis-2022]

- id: hot-swollen-joint
  sign: The knee is hot, red, and swollen
  description: >-
    A joint that is visibly swollen and hot to the touch may be infected or acutely
    inflamed. This is urgent — it is not a stiffness problem and exercise is not the answer.
  sources: [nice-ng226-osteoarthritis-2022, aaos-knee-arthritis]

- id: fever-with-joint-pain
  sign: Fever alongside knee pain or swelling
  description: >-
    Feeling feverish or unwell together with a painful, swollen knee can indicate joint
    infection. Seek medical care promptly.
  sources: [nice-ng226-osteoarthritis-2022]

- id: sudden-severe-pain
  sign: Sudden severe pain
  description: >-
    Pain that comes on abruptly and is severe, particularly with a pop or tearing
    sensation, suggests an acute injury rather than progressive stiffness.
  sources: [aaos-knee-arthritis]

- id: night-pain
  sign: Pain that wakes you at night
  description: >-
    Pain that is present at rest or that reliably wakes you from sleep is a different
    pattern from mechanical stiffness and should be assessed.
  sources: [nice-ng226-osteoarthritis-2022]

- id: pain-after-trauma
  sign: Pain following a fall or injury
  description: >-
    Knee pain that began with a specific fall, twist, or blow needs assessment to rule out
    fracture or ligament injury before you start moving it deliberately.
  sources: [aaos-knee-arthritis]
