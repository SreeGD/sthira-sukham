- id: cannot-bear-weight
  order: 10
  sign: You cannot put weight through the leg
  description: You are unable to stand or walk on the leg, or can only do so with severe pain.
    This needs assessment before any exercise.
  sources:
    - aaos-knee-arthritis
    - nice-ng226-osteoarthritis-2022
  joints: &a1
    - knee
    - hip
    - ankle
- id: locking
  order: 20
  sign: The knee locks or catches
  description: The knee gets stuck part-way through bending or straightening, or catches sharply
    and then releases. Something may be physically blocking the joint, and forcing movement
    through a block can do damage.
  sources:
    - aaos-knee-arthritis
    - nice-ng226-osteoarthritis-2022
  joints: *a1
- id: giving-way
  order: 30
  sign: The knee gives way
  description: The leg buckles or collapses under you without warning. This points to instability
    or to the muscles not firing when needed, and it carries a real risk of falling.
  sources:
    - aaos-knee-arthritis
  joints: *a1
- id: hip-groin-pain-after-fall
  order: 34
  joints:
    - hip
  sign: Groin pain after a fall, especially if you cannot weight-bear
  description: Hip fractures can follow a fall that seemed minor, particularly in older adults,
    and pain is often felt in the groin rather than over the hip. Do not try to walk it off.
  sources:
    - nice-ng226-osteoarthritis-2022
    - neumann-kinesiology-2016
- id: hip-referred-thigh-pain
  order: 36
  joints:
    - hip
    - knee
  sign: Deep thigh or knee pain with no knee findings
  description: Hip problems commonly refer pain down the thigh to the knee. A knee that hurts but
    examines normally is a reason to have the hip looked at rather than to keep working on the
    knee.
  sources:
    - nice-ng226-osteoarthritis-2022
- id: hot-swollen-joint
  order: 40
  sign: The knee is hot, red, and swollen
  description: A joint that is visibly swollen and hot to the touch may be infected or acutely
    inflamed. This is urgent — it is not a stiffness problem and exercise is not the answer.
  sources:
    - nice-ng226-osteoarthritis-2022
    - aaos-knee-arthritis
  joints: *a1
- id: ankle-cannot-weight-bear-after-inversion
  order: 44
  joints:
    - ankle
  sign: Cannot take four steps after rolling the ankle
  description: Being unable to weight-bear immediately after an ankle injury, or tenderness over
    the bony points at either side, is a recognised reason to have it assessed for fracture
    rather than treated as a sprain.
  sources:
    - neumann-kinesiology-2016
- id: ankle-sudden-calf-pop
  order: 46
  joints:
    - ankle
  sign: A sudden pop or snap at the back of the ankle
  description: A sharp pop at the back of the ankle with sudden weakness pushing off can indicate
    an Achilles tendon rupture. It is sometimes surprisingly painless afterwards, which is why
    it gets ignored.
  sources:
    - neumann-kinesiology-2016
- id: fever-with-joint-pain
  order: 50
  sign: Fever alongside knee pain or swelling
  description: Feeling feverish or unwell together with a painful, swollen knee can indicate joint
    infection. Seek medical care promptly.
  sources:
    - nice-ng226-osteoarthritis-2022
  joints: *a1
- id: sudden-severe-pain
  order: 60
  sign: Sudden severe pain
  description: Pain that comes on abruptly and is severe, particularly with a pop or tearing
    sensation, suggests an acute injury rather than progressive stiffness.
  sources:
    - aaos-knee-arthritis
  joints: *a1
- id: pain-after-trauma
  order: 70
  sign: Pain following a fall or injury
  description: Knee pain that began with a specific fall, twist, or blow needs assessment to rule
    out fracture or ligament injury before you start moving it deliberately.
  sources:
    - aaos-knee-arthritis
  joints: *a1
- id: night-pain
  order: 80
  sign: Pain that wakes you at night
  description: Pain that is present at rest or that reliably wakes you from sleep is a different
    pattern from mechanical stiffness and should be assessed.
  sources:
    - nice-ng226-osteoarthritis-2022
  joints: *a1
- id: cannot-push-off-sudden
  order: 84
  joints:
    - ankle
    - foot
  sign: A sudden snap at the back of the ankle, then no push-off
  description: A sharp snap or a sensation of being kicked in the back of the ankle, followed by
    being unable to rise onto the toes, can mean the Achilles tendon has ruptured. Walking may
    still be possible, which is why this is missed. It needs same-day assessment.
  sources:
    - neumann-kinesiology-2016
- id: hot-swollen-toe-joint
  order: 86
  joints:
    - foot
  sign: A hot, red, swollen big toe joint
  description: A big toe joint that is hot, red and acutely painful — often coming on overnight —
    is a different problem from mechanical stiffness, and can indicate gout or infection. It needs
    assessment rather than stretching.
  sources:
    - aaos-hallux-rigidus
- id: foot-numbness-or-lost-sensation
  order: 88
  joints:
    - foot
    - ankle
  sign: Numbness, burning, or reduced feeling in the foot
  description: Loss of sensation in the foot changes what is safe to do, because you cannot feel
    the warning signs that would normally stop you. This is particularly important for anyone with
    diabetes. Get it assessed before starting foot exercises.
  sources:
    - nice-ng226-osteoarthritis-2022
    - jospt-heel-pain-2023
