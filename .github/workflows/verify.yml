name: verify

# The badge in the README points at this workflow. It runs the same `pnpm verify`
# gate used locally — build, content policy, network isolation, unit and e2e — so a
# green badge means those actually passed, not that someone wrote "passing" in a URL.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Playwright needs the browser and its system libraries; nothing else is fetched.
      - run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      # build → validate → check:isolation → test → test:e2e
      - name: Verify
        run: pnpm verify

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
